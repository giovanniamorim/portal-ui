<div class="page-container">
  <div class="card-body">
    <button class="header-button" mat-raised-button color="primary" routerLink="/balancos" >
      <mat-icon>arrow_circle_left</mat-icon>
      Voltar
    </button>
    <h5 class="header-title">Planejamento</h5>
    <h6 class="header-subtitle mb-1">
      Formulário de inclusão de novo planejamento
    </h6>
  </div>
  <mat-card class="mt-3">
    <div class="mt-3 mb-3">
      <span class="material-icons card-title-icon">edit_attributes</span>     
      <h3 class="card-title" *ngIf="isEditPlanejamento">
        Editando Planejamento. ID: {{currentId}}</h3>
        <h3 class="card-title" *ngIf="!isEditPlanejamento">Novo Planejamento </h3>
      </div>

    <mat-card-content class="toolbar-card-content">
      <form [formGroup]="form">
        <div class="row">
          <div class="col-lg-6 col-md-6 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Ano</mat-label>
              <input
                matInput
                placeholder="Ano"
                formControlName="ano"
                required
              />
            </mat-form-field>
          </div>
          <div class="col-lg-6 col-md-6 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Descrição</mat-label>
              <input
                matInput
                placeholder="Descrição"
                formControlName="descricao"
                required
              />
          </mat-form-field>
        
          </div>
        </div>
       
        <div  class="row">
          <mat-form-field appearance="fill">
            <mat-label>Arquivo</mat-label>
            <input
              readonly
              matInput
              placeholder="Arquivo"
              formControlName="fileUrl"
            />
            <mat-hint>O Nome e o Caminho do arquivo são gerados automaticamente e só estarão disponiveis para download após o upload.</mat-hint>
          </mat-form-field>
        </div>
        
      </form>
    </mat-card-content>
    
    <mat-card-actions class="mt-3 mb-3" align="end">
      <button *ngIf="!isEditPlanejamento" 
        class="header-button" 
        mat-raised-button color="third"
        (click)="onSubmit()"
        [disabled]="!form.valid"
        >
        <mat-icon>save_circle_outline</mat-icon>
        Salvar Planejamento
      </button>

      <button  *ngIf="isEditPlanejamento"
        class="header-button" 
        mat-raised-button color="third"
        (click)="onEdit()"
        [disabled]="!form.valid"
        >
        <mat-icon>save_circle_outline</mat-icon>
        Atualizar Planejamento
      </button>

    </mat-card-actions>
  </mat-card>


</div>
