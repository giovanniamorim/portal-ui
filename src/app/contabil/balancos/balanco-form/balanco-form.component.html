<div class="page-container">
  <div class="card-body">
    <button class="header-button" mat-raised-button color="primary" routerLink="/balancos" >
      <mat-icon>arrow_circle_left</mat-icon>
      Voltar
    </button>
    <h5 class="header-title">Balanço</h5>
    <h6 class="header-subtitle mb-1">
      Formulário de inclusão de novo balanço
    </h6>
  </div>
  <div class="row">
    <div class="col col-sm-12 col-md-8 col-lg-8">
      <mat-card class="mt-3">
        <div class="mt-3 mb-3">
          <span class="material-icons card-title-icon">edit_attributes</span>     
          <h3 class="card-title" *ngIf="isEditBalanco">
            Editando Balanço. ID: {{currentId}}</h3>
            <h3 class="card-title" *ngIf="!isEditBalanco">Novo Balanço </h3>
          </div>

        <mat-card-content class="toolbar-card-content">
          <form [formGroup]="form">
            <div class="row">
              <div class="col-lg-6 col-md-6 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Ano</mat-label>
                  <input
                    matInput
                    placeholder="Ano"
                    formControlName="ano"
                    required
                  />
                </mat-form-field>
              </div>
              <div class="col-lg-6 col-md-6 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Mês</mat-label>
                  <mat-select placeholder="Selecione um mês" formControlName="mes" >
                    <mat-option *ngFor="let mes of meses" [value]="mes.nome">{{ mes.nome }}</mat-option>
                    </mat-select>
                  </mat-form-field>
              </div>
            </div>
            <div class="col col-sm-12 col-md-12 col-lg-12">
              <mat-form-field appearance="fill">
                <mat-label>Descrição</mat-label>
                <textarea  matInput placeholder="descrição" formControlName="descricao"></textarea>
              </mat-form-field>
            </div>
          </form>
        </mat-card-content>
        
        <mat-card-actions class="mt-3 mb-3" align="end">
          <button *ngIf="!isEditBalanco" 
            class="header-button" 
            mat-raised-button color="third"
            (click)="onSubmit()"
            [disabled]="!form.valid"
            >
            <mat-icon>save_circle_outline</mat-icon>
            Salvar Balanço
          </button>

          <button  *ngIf="isEditBalanco"
            class="header-button" 
            mat-raised-button color="third"
            (click)="onEdit()"
            [disabled]="!form.valid"
            >
            <mat-icon>save_circle_outline</mat-icon>
            Atualizar Balanço
          </button>

        </mat-card-actions>
      </mat-card>
    </div>
    
    <div class="col col-sm-12 col-md-4 col-lg-4">
      <mat-card class="mt-3">
        <mat-card-content> 
          <app-file-upload 
          [fileName]="balancoFileName"
          [editingId]="currentId"
          ></app-file-upload>
        </mat-card-content>
      </mat-card>
    </div>
  
  </div>

</div>
