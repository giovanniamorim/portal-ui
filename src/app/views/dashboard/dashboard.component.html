      </c-col>

          <svg cIcon name="cilCloudDownload"></svg>
        </button> -->

      </c-col>
    </c-row>
    <c-chart
      [data]="mainChart.data"
      [height]="300"
      [ngStyle]="{ 'marginTop.px': 40 }"
      [options]="mainChart.options"
      [type]="mainChart.type"
    >
      Main chart
    </c-chart>
  </c-card-body>
  <c-card-footer>
    <c-row class="text-center" [md]="3" [xs]="1">
      <c-col class="mb-sm-2 mb-0">
        <div class="text-medium-emphasis">Total 2023</div>
        <strong>R$ 2.526.236,01 (78%)</strong>
        <c-progress class="mt-2" thin>
          <c-progress-bar color="info" value="78"></c-progress-bar>
        </c-progress>
      </c-col>
      <c-col class="mb-sm-2 mb-0">
        <div class="text-medium-emphasis">Total 2022</div>
        <strong>R$ 3.526.236,01 (95%)</strong>
        <c-progress class="mt-2" thin>
          <c-progress-bar color="success" value="95"></c-progress-bar>
        </c-progress>
      </c-col>
      <c-col class="mb-sm-2 mb-0">
        <div class="text-medium-emphasis">Total 2021</div>
        <strong>R$ 3.128.854,01 (86%)</strong>
        <c-progress class="mt-2" thin>
          <c-progress-bar color="danger" value="86"></c-progress-bar>
        </c-progress>
      </c-col>
      
      
    </c-row>
  </c-card-footer>
</c-card>
