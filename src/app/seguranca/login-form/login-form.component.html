<div class="d-lg-flex half">
  <div
    class="bg order-1 order-md-2"
    style="background-image: url('https://dynamic-media-cdn.tripadvisor.com/media/photo-o/13/a8/32/90/as-vistas-sao-muito-legais.jpg?w=1200&h=-1&s=1');"
  ></div>
  <div class="contents order-2 order-md-1">
    <div class="container">
      <div class="row align-items-center justify-content-center">
        <div class="col-md-7">
            <div>
                <img src="../../../assets/img/brand/logo-sindifisco-login.png" alt="Sindifisco-PA">
            </div>
          <p class="mb-4">
            Bem-vindo. Aqui você acompanha como suas contribuições são
            investidas.
          </p>
          <div *ngIf="!isValid" class="alert alert-danger" role="alert">
            {{ message }}
          </div>
          <div *ngIf="carregando" class="spinner">
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          </div>
          <form autocomplete="off" #loginForm="ngForm">
            <div class="form-group first">
              <label for="username">Usuário</label>
              <input 
                type="email" 
                name="usuario" 
                class="form-control"
                placeholder="Seu email"
                ngModel required #usuario>
            </div>
            <div class="form-group last mb-3">
              <label for="password">Senha</label>
              <input
                type="password"
                class="form-control"
                name="senha" 
                placeholder="Senha" 
                ngModel 
                required 
                #senha
              />
            </div>


            <div class="col-12">
                <button class="btn btn-block btn-primary" type="submit" [disabled]="loginForm.invalid"
                    (click)="login(usuario.value, senha.value); senha.value='';">Entrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
