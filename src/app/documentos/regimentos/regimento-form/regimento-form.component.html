<div class="page-container">
  <div class="card-body">
    <button class="header-button" mat-raised-button color="primary" routerLink="/documentos/regimentos" >
      <mat-icon>arrow_circle_left</mat-icon>
      Voltar
    </button>
    <h5 class="header-title">Regimento</h5>
    <h6 class="header-subtitle mb-1">
      Formulário de inclusão de novo regimento
    </h6>
  </div>
  <div class="row">
    <div class="col col-sm-12 col-md-8 col-lg-8">
      <mat-card class="mt-3">
        <div class="mt-3 mb-3">
          <span class="material-icons card-title-icon">edit_attributes</span>     
          <h3 class="card-title" *ngIf="isEditRegimento">
            Editando Regimento. ID: {{currentId}}</h3>
            <h3 class="card-title" *ngIf="!isEditRegimento">Novo Regimento </h3>
        </div>
        <mat-card-content class="toolbar-card-content">
          <form [formGroup]="form">
            <div class="row">
              <div class="col col-lg-3 col-md-3 col-sm-12">
                <mat-form-field appearance="fill">
                <mat-label>Data da Aprovação</mat-label>
                <input
                  matInput 
                  [matDatepicker]="picker"
                  type="text"
                  placeholder="Data da Aprovação"
                  formControlName="dataAprovacao"
                  />
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
              </div>

              <div class="col col-lg-9 col-md-9 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Descrição</mat-label>
                  <textarea  matInput placeholder="descrição" formControlName="descricao"></textarea>
                </mat-form-field>
              </div>
            </div>
          </form>
        </mat-card-content>
        
        <mat-card-actions class="mt-3 mb-3" align="end">
          <button *ngIf="!isEditRegimento" 
            class="header-button" 
            mat-raised-button color="third"
            (click)="onSubmit()"
            [disabled]="!form.valid"
            >
            <mat-icon>save_circle_outline</mat-icon>
            Salvar Regimento
          </button>

          <button  *ngIf="isEditRegimento"
            class="header-button" 
            mat-raised-button color="third"
            (click)="onEdit()"
            [disabled]="!form.valid"
            >
            <mat-icon>save_circle_outline</mat-icon>
            Atualizar Regimento
          </button>

        </mat-card-actions>
      </mat-card>
    </div>
    
    <div class="col col-sm-12 col-md-4 col-lg-4">
      <mat-card class="mt-3">
        <mat-card-content> 
          <app-file-upload 
          [fileName]="regimentoFileName"
          [editingId]="currentId"
          ></app-file-upload>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
