<div class="page-container">
  <div class="card-body">
    <button
      class="header-button"
      mat-raised-button
      color="primary"
      routerLink="/juridico/processos"
    >
      <mat-icon>arrow_circle_left</mat-icon>
      Voltar
    </button>
    <h5 class="header-title">Processo</h5>
    <h6 class="header-subtitle mb-1">
      Formulário de inclusão de novo Processo
    </h6>
  </div>

  <mat-card class="mt-3">
    <div class="mt-3 mb-3">
      <span class="material-icons card-title-icon">edit_attributes</span>
      <h3 class="card-title" *ngIf="isEditProcesso">
        Editando Processo. ID: {{ currentId }}
      </h3>
      <h3 class="card-title" *ngIf="!isEditProcesso">
        Novo Processo
      </h3>
    </div>

    <mat-card-content class="toolbar-card-content">
      <form [formGroup]="form">
        <div class="row">
          <div class="col col-lg-4 col-md-4 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Número</mat-label>
              <input
                matInput 
                placeholder="Número"
                formControlName="numero"
                required
              />
            </mat-form-field>
          </div>
          <div class="col col-lg-4 col-md-4 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Exequente</mat-label>
              <input
                matInput
                placeholder="Exequente"
                formControlName="exequente"
                required
              />
            </mat-form-field>
          </div>
          <div class="col col-lg-4 col-md-4 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Executado</mat-label>
              <input
                matInput
                placeholder="Executado"
                formControlName="executado"
                required
              />
            </mat-form-field>
          </div>
          <div class="row">
          <div class="col col-lg-4 col-md-4 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Juízo</mat-label>
              <input
                matInput
                placeholder="Juízo"
                formControlName="juizo"
                required
              />
            </mat-form-field>
          </div>
          <div class="col col-lg-4 col-md-4 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Assunto</mat-label>
              <input
                matInput
                placeholder="Assunto"
                formControlName="assunto"
                required
              />
            </mat-form-field>
          </div>

          <div class="col col-lg-4 col-md-4 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Valor</mat-label>
              <input
                matInput
                placeholder="Valor"
                formControlName="valor"
                required
              />
            </mat-form-field>
          </div>
        </div>
        </div>

      </form>
    </mat-card-content>

    <mat-card-actions class="mt-3 mb-3" align="end">
      <button
        *ngIf="!isEditProcesso"
        class="header-button"
        mat-raised-button
        color="third"
        (click)="onSubmit()"
        [disabled]="!form.valid"
        >
        <mat-icon>save_circle_outline</mat-icon>
        Salvar Processo
      </button>

      <button
        *ngIf="isEditProcesso"
        class="header-button"
        mat-raised-button
        color="third"
        (click)="onEdit()"
        [disabled]="!form.valid"
      >
        <mat-icon>save_circle_outline</mat-icon>
        Atualizar Processo
      </button>
    </mat-card-actions>
  </mat-card>
</div>
