<div class="page-container">
  <div class="card-body">
    <button class="header-button" mat-raised-button color="primary" routerLink="/documentos/contratos" >
      <mat-icon>arrow_circle_left</mat-icon>
      Voltar
    </button>
    <h5 class="header-title">Contrato</h5>
    <h6 class="header-subtitle mb-1">
      Formulário de inclusão de novo contrato
    </h6>
  </div>

  <div class="row">
    <div class="col col-sm-12 col-md-8 col-lg-8">
      <mat-card class="mt-3">
        <div class="mt-3 mb-3">
          <span class="material-icons card-title-icon">edit_attributes</span>     
          <h3 class="card-title" *ngIf="isEditContrato">
            Editando Contrato. ID: {{currentId}}</h3>
            <h3 class="card-title" *ngIf="!isEditContrato">Novo Contrato </h3>
          </div>

        <mat-card-content class="toolbar-card-content">
          <form [formGroup]="form">
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Prestador</mat-label>
                  <input
                    matInput
                    placeholder="Prestador"
                    formControlName="prestador"
                    
                  />
                </mat-form-field>
              </div>

            </div>
            <div class="row">
              <div class="col-lg-8 col-md-8 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Descrição do serviço</mat-label>
                  <input
                    matInput
                    placeholder="Descrição do serviço"
                    formControlName="descServico"
                    
                  />
                </mat-form-field>
              </div>
              <div class="col-lg-2 col-md-2 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Data Inicial</mat-label>
                  <input
                    matInput
                    [matDatepicker]="picker"
                    type="text"
                    placeholder="Data Inicial"
                    formControlName="dataInicial"
                    
                  />
                  <mat-datepicker-toggle
                    matSuffix
                    [for]="picker"
                  ></mat-datepicker-toggle>
                  <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
              </div>
              <div class="col-lg-2 col-md-2 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Data Final</mat-label>
                  <input
                    matInput
                    [matDatepicker]="picker2"
                    type="text"
                    placeholder="Data Final"
                    formControlName="dataFinal"
                    
                  />
                  <mat-datepicker-toggle
                    matSuffix
                    [for]="picker2"
                  ></mat-datepicker-toggle>
                  <mat-datepicker #picker2></mat-datepicker>
                </mat-form-field>
              </div>
              

            </div>
            <div class="row">
              <div class="col-lg-9 col-md-9 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Observações</mat-label>
                  <input
                    matInput
                    placeholder="Observações"
                    formControlName="obs"
                  />
                </mat-form-field>
              </div>

              <div class="col col-lg-3 col-md-3 col-sm-12">
                <mat-form-field appearance="fill">
                  <mat-label>Valor</mat-label>
                  <input
                    matInput
                    placeholder="Valor"
                    formControlName="valor"
                    required
                    currencyMask
                    [options]="{ prefix: '', thousands: '.', decimal: ',' }"
                  />
                </mat-form-field>
              </div>
            </div>


            
          </form>
        </mat-card-content>
        
        <mat-card-actions class="mt-3 mb-3" align="end">
          <button *ngIf="!isEditContrato" 
            class="header-button" 
            mat-raised-button color="third"
            (click)="onSubmit()"
            [disabled]="!form.valid"
            >
            <mat-icon>save_circle_outline</mat-icon>
            Salvar Contrato
          </button>

          <button  *ngIf="isEditContrato"
            class="header-button" 
            mat-raised-button color="third"
            (click)="onEdit()"
            [disabled]="!form.valid"
            >
            <mat-icon>save_circle_outline</mat-icon>
            Atualizar Contrato
          </button>

        </mat-card-actions>
      </mat-card>
    </div>
    <div class="col col-sm-12 col-md-4 col-lg-4">
      <mat-card class="mt-3">
        <mat-card-content> 
          <app-file-upload 
            [fileName]="contratoFileName"
            [editingId]="currentId"
          ></app-file-upload>
        </mat-card-content>
      </mat-card>
    </div>

  </div>


</div>
