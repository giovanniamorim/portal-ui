<div class="page-container">
  <div class="card-body">
    <button class="header-button" mat-raised-button color="primary" routerLink="/usuarios" >
      <mat-icon>arrow_circle_left</mat-icon>
      Voltar
    </button>
    <h5 class="header-title">Usuário</h5>
    <h6 class="header-subtitle mb-1">
      Formulário de inclusão de novo usuário
    </h6>
  </div>
  
  <mat-card class="mt-3">
    <div class="mt-3 mb-3">
      <span class="material-icons card-title-icon">edit_attributes</span>     
      <h3 class="card-title" *ngIf="isEditUser">
        Editando Usuário. ID: {{currentId}}</h3>
        <h3 class="card-title" *ngIf="!isEditUser">Novo Usuário </h3>
    </div>

    <mat-card-content class="toolbar-card-content">
      <form [formGroup]="form">
        <div class="row">
          
            <mat-form-field appearance="fill">
              <mat-label>Nome</mat-label>
              <input
                matInput
                placeholder="Nome"
                formControlName="nome"
                required
              />
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Email</mat-label>
              <input
                matInput
                placeholder="Email"
                formControlName="email"
                required
              />
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Senha</mat-label>
              <input
                matInput
                placeholder="Senha"
                formControlName="senha"
                required
              />
            </mat-form-field>
          
        </div>
        <div class="col col-lg-4 col-md-4 col-sm-12">
          <mat-form-field appearance="fill">
            <mat-label>Perfil</mat-label>
            <mat-select placeholder="Selecione um perfil" formControlName="perfil" >
              <mat-option *ngFor="let perfil of permissoes" [value]="perfil.nome">{{ perfil.nome }}</mat-option>
          </mat-select>
        </mat-form-field>
        </div>
        
       

      </form>
    </mat-card-content>  
    
    <mat-card-actions class="mt-3 mb-3" align="end">
      
      <button *ngIf="!isEditUser" 
        class="header-button" 
        mat-raised-button color="third"
        (click)="onSubmit()"
        >
        <mat-icon>save_circle_outline</mat-icon>
        Salvar Usuário
      </button>

      <button  *ngIf="isEditUser"
        class="header-button" 
        mat-raised-button color="third"
        (click)="onEdit()"
        >
        <mat-icon>save_circle_outline</mat-icon>
        Atualizar Usuário
      </button>

      

    </mat-card-actions>
  </mat-card>


</div>
