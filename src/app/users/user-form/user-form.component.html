<div class="page-container">
  <div class="card-body">
    <button class="header-button" mat-raised-button color="primary" routerLink="/usuarios" >
      <mat-icon>arrow_circle_left</mat-icon>
      Voltar
    </button>
    <h5 class="header-title">Usuário</h5>
    <h6 class="header-subtitle mb-1">
      Formulário de inclusão de novo usuário
    </h6>
  </div>
  
  <mat-card class="mt-3">
    <div class="mt-3 mb-3">
      <span class="material-icons card-title-icon">edit_attributes</span>     
      <h3 class="card-title" *ngIf="isEditUser">
        Editando Usuário. ID: {{currentId}}</h3>
        <h3 class="card-title" *ngIf="!isEditUser">Novo Usuário </h3>
    </div>

    <mat-card-content class="toolbar-card-content">
      <form [formGroup]="form">
        <div class="row">
          <div class="col col-lg-6 col-md-6 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Nome</mat-label>
              <input
                matInput
                placeholder="Nome"
                formControlName="nome"
                required
              />
            </mat-form-field>
          </div>
          <div class="col col-lg-6 col-md-6 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Email</mat-label>
              <input
                matInput
                placeholder="Email"
                formControlName="email"
                required
              />
            </mat-form-field>
            </div>
        </div>

        <div class="row">
          <div class="col col-lg-3 col-md-3 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Celular</mat-label>
              <input
                matInput
                mask="(00) 0 0000-0000"
                placeholder="Celular"
                formControlName="celular"
                required
              />
            </mat-form-field>
            </div>
          <div class="col col-lg-4 col-md-4 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>CPF</mat-label>
              <input
                matInput
                mask="000.000.000-00"
                placeholder="CPF"
                formControlName="cpf"
                required
              />
            </mat-form-field>
          </div>
          <div class="col col-lg-3 col-md-3 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>RG</mat-label>
              <input
                matInput
                placeholder="RG"
                formControlName="rg"
              />
            </mat-form-field>
          </div>
          <div class="col col-lg-2 col-md-2 col-sm-12">
            <mat-form-field appearance="fill">
              <mat-label>Órgão Expeditor</mat-label>
              <input
                matInput
                placeholder="Órgão Expeditor"
                formControlName="rg_orgao_exp"
              />
            </mat-form-field>
            </div>
        </div>
        <div class="row">

            <mat-form-field appearance="fill">
              <mat-label>Matrícula</mat-label>
              <input
                matInput
                placeholder="Matrícula"
                formControlName="matricula"
              />
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Situação Cadastral</mat-label>
              <mat-select placeholder="Selecione uma situação" formControlName="situacao" >
                <mat-option *ngFor="let sit of situacoes" [value]="sit.nome">{{ sit.nome }}</mat-option>
              </mat-select>
            </mat-form-field>

        </div>

        <!-- <div class="col col-lg-4 col-md-4 col-sm-12" *ngIf="isEditUser && perfil !== 'SINDICALIZADO'">
          <mat-form-field>

            <div *ngFor="let item of listaPermissoes">
              <mat-checkbox [checked]="item.descricao" (change)="onChange(item)" formControlName="permissoes" >
                {{ item.descricao }}
              </mat-checkbox>
            </div>
          </mat-form-field>

        </div> -->
        

      </form>
    </mat-card-content>  
    
    <mat-card-actions class="mt-3 mb-3" align="end">
      
      <button *ngIf="!isEditUser" 
        class="header-button" 
        mat-raised-button color="third"
        (click)="onSubmit()"
        >
        <mat-icon>save_circle_outline</mat-icon>
        Salvar Usuário
      </button>

      <button  *ngIf="isEditUser"
        class="header-button" 
        mat-raised-button color="third"
        (click)="onEdit()"
        >
        <mat-icon>save_circle_outline</mat-icon>
        Atualizar Usuário
      </button>

      

    </mat-card-actions>
  </mat-card>


</div>
