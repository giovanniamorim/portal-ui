<div class="page-container mb-5">
    <div class="card-body">  
      <h5 class="header-title">Alterar Senha</h5>
      <h6 class="header-subtitle mb-1">Página de alteração de senha. Escolha uma senha forte</h6>
    </div>
    <mat-card class="mt-3">
        <mat-card-content>
            <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">

                <div class="example-container">
                    <mat-form-field appearance="fill">
                    <mat-label for="oldPassword">Senha atual</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" name="oldPassword" formControlName="oldPassword">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <div *ngIf="changePasswordForm.get('oldPassword')?.invalid && changePasswordForm.get('oldPassword')?.touched">
                        <div *ngIf="changePasswordForm.get('oldPassword')?.errors?.required">Senha atual é obrigatória</div>
                    </div>
                    </mat-form-field>
                </div>

                <div class="example-container">
                    <mat-form-field appearance="fill">
                    <mat-label for="oldPassword">Nova Senha</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" name="newPassword" formControlName="newPassword">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <div *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched">
                        <div *ngIf="changePasswordForm.get('newPassword')?.errors?.required">Nova senha é obrigatória</div>
                        </div>
                    </mat-form-field>
                </div>

                <div class="example-container">
                    <mat-form-field appearance="fill">
                    <mat-label for="oldPassword">Confirmar Nova Senha</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" name="confirmPassword" formControlName="confirmPassword">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <div *ngIf="changePasswordForm.get('confirmPassword')?.invalid && changePasswordForm.get('confirmPassword')?.touched">
                        <div *ngIf="changePasswordForm.get('confirmPassword')?.errors?.required">Confirmação de senha é obrigatória</div>
                        </div>
                        <div *ngIf="changePasswordForm.hasError('passwordMismatch') && changePasswordForm.touched">
                            Nova senha e confirmação não coincidem
                        </div>
                    </mat-form-field>
                </div>

                <button mat-raised-button class="m-1" color="primary" type="submit" [disabled]="!changePasswordForm.valid">
                    <mat-icon>add_circle_outline</mat-icon>
                    Alterar Senha
                </button>  
            </form>


        

        </mat-card-content>
    </mat-card>
</div>
