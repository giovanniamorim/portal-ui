<h2>Change Password</h2>

<form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="oldPassword">Old Password:</label>
    <input type="password" name="oldPassword" formControlName="oldPassword">
    <div *ngIf="changePasswordForm.get('oldPassword')?.invalid && changePasswordForm.get('oldPassword')?.touched">
      <div *ngIf="changePasswordForm.get('oldPassword')?.errors?.required">Old password is required</div>
    </div>
  </div>

  <div>
    <label for="newPassword">New Password:</label>
    <input type="password" name="newPassword" formControlName="newPassword">
    <div *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched">
      <div *ngIf="changePasswordForm.get('newPassword')?.errors?.required">New password is required</div>
    </div>
  </div>

  <div>
    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" name="confirmPassword" formControlName="confirmPassword">
    <div *ngIf="changePasswordForm.get('confirmPassword')?.invalid && changePasswordForm.get('confirmPassword')?.touched">
      <div *ngIf="changePasswordForm.get('confirmPassword')?.errors?.required">Confirm password is required</div>
    </div>
    <div *ngIf="changePasswordForm.hasError('passwordMismatch') && changePasswordForm.touched">
      Passwords do not match
    </div>
  </div>

  <button type="submit" [disabled]="!changePasswordForm.valid">Change Password</button>
</form>
