<div class="page-container mb-5">
  <div class="card-body">
    <button
      class="header-button"
      mat-raised-button
      color="primary"
      (click)="addAssembleia()"
    >
      <mat-icon>add_circle_outline</mat-icon>
      Novo Assembleia
    </button>
    <h5 class="header-title">Assembleias</h5>
    <h6 class="header-subtitle mb-1">Lista de registros de Assembleias</h6>
  </div>
   <!-- Inicio do Card de busca -->
  <mat-card class="mb-3 mt-3">
    <mat-card-content class="toolbar-card-content">
      <div class="row mt-2">
        <div class="col col-lg-8 col-md-6 col-sm-12">
          <mat-form-field>
            <input matInput autocomplete="off" (keyup)="filterData($event)" placeholder="Busca" type="search" />
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
        </div>
        
      </div>

    </mat-card-content>
  </mat-card>
  <div class="alert alert-warning" *ngIf="!carregando && totalElements == 0">
    <i class="fa-regular fa-circle-xmark"></i>
    <div class="icon hidden-xs">
      <i class="fa fa-exclamation-circle"></i>
    </div>
    <strong>Opps!</strong>
    <Br /> Nenhum registro encontrado para sua busca
  </div>
  <!-- Fim do Card de busca -->
  <div class="table-container" *ngIf="totalElements > 0">
    <table mat-table 
          [dataSource]="datasource" 
          matSort (matSortChange)="listarAssembleias($event)"
          class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por Id">#</th>
        <td mat-cell *matCellDef="let assembleia">{{ assembleia.id }}</td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef mat-sort-header >Data</th>
        <td mat-cell *matCellDef="let assembleia">
          {{ assembleia.data | date: 'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header >Tipo</th>
        <td mat-cell *matCellDef="let assembleia">
          {{ assembleia.tipo }}
        </td>
      </ng-container>

      <ng-container matColumnDef="assunto">
        <th mat-header-cell *matHeaderCellDef mat-sort-header >Assunto</th>
        <td mat-cell *matCellDef="let assembleia">
          {{ assembleia.assunto }}
        </td>
      </ng-container>

      <ng-container matColumnDef="comentario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header >Comentário</th>
        <td mat-cell *matCellDef="let assembleia">
          {{ assembleia.comentario }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fileUrl">
        <th mat-header-cell *matHeaderCellDef >Arquivo</th>
        <td mat-cell *matCellDef="let assembleia">
          <span *ngIf="assembleia.fileUrl && assembleia.fileUrl !== this.s3Url + 'undefined.pdf'">
            <a href="{{ assembleia.fileUrl }}">
              <span class="material-icons">picture_as_pdf</span>
            </a>
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell class="header-last-column" *matHeaderCellDef></th>
        <td mat-cell class="last-column" *matCellDef="let assembleia">
          <button (click)="onEdit(assembleia)" mat-icon-button color="primary" aria-label="Editar Assembleia">
            <mat-icon>edit</mat-icon>
          </button>
          <button (click)="onDelete(assembleia)" mat-icon-button color="accent" aria-label="Excluir Assembleia">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator 
        [length]="totalElements"
        [pageSize]="5"
        [pageSizeOptions]="[5, 10, 25, 100]"
        (page)="nextPage($event)"
        >
    </mat-paginator>

  </div>
  
    <div *ngIf="carregando" class="spinner">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
  
</div>
