<div class="alert alert-warning" role="alert">
  <strong>ATENÇÃO:</strong>
  O arquivo deve ter exatamente o nome:
  <strong>{{ fileName }}</strong>
</div>
<div *ngIf="message.length">
  <div *ngFor="let msg of message; let i = index">
    <div class="alert alert-danger" role="alert">
      {{ msg }}
    </div>
  </div>
</div>
<div *ngFor="let progressInfo of progressInfos">
  <span>{{ progressInfo.fileName }}</span>
  <mat-toolbar class="progress-bar">
    <mat-progress-bar
      color="accent"
      [value]="progressInfo.value"
    ></mat-progress-bar>
    <span class="progress">{{ progressInfo.value }}%</span>
  </mat-toolbar>
</div>

<div class="row">
  <div class="col col-sm-12 col-md-10 col-lg-10">
    <mat-form-field appearance="fill">
      <div>
        <input
          matInput
          [value]="
            selectedFileNames.length ? selectedFileNames : 'Selecionar Imagem'
          "
        />
        <input
          type="file"
          id="fileInput"
          name="fileInput"
          accept="image/*"
          multiple
          (change)="selectFiles($event)"
        />
      </div>
    </mat-form-field>
  </div>
  <div class="col col-sm-12 col-md-2 col-lg-1">
    <button
      mat-flat-button
      color="primary"
      [disabled]="!selectedFiles"
      (click)="uploadFiles()"
    >
      Upload
    </button>
  </div>
  <div class="col col-sm-12 col-md-2 col-lg-1">
    <button mat-flat-button color="primary" (click)="deleteImagens()">
      Limpar
    </button>
  </div>
</div>

<div>
  <img *ngFor="let preview of previews" [src]="preview" class="preview" />
</div>
